name: weekly-stock-report

on:
  schedule:
    # 暫時改成每天發送，方便測試期間快速找問題；穩定後記得改回每週一
    - cron: '0 22 * * *'   # UTC 每日 22:00 = 台灣每日 06:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python src/fetch_data.py

      - name: Generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/generate_report.py

      - name: Send to LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_PUSH_TARGET_IDS: ${{ secrets.LINE_PUSH_TARGET_IDS }}
        run: python src/send_line.py

      - name: Archive report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - run: git add reports/

      - name: Commit report if changed
        run: git diff --staged --quiet || git commit -m "weekly report $(date +%F)"

      - name: Push report (retry on race with other workflows in this repo)
        run: |
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, pulling and retrying ($i)..."
            git pull --rebase origin main
          done
          git push

      - name: Notify failure
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_PUSH_TARGET_IDS: ${{ secrets.LINE_PUSH_TARGET_IDS }}
        run: python src/notify_failure.py
