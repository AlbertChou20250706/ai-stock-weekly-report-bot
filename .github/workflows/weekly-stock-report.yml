name: weekly-stock-report

on:
  schedule:
    # 每週一台灣 05:00 發送（涵蓋上週一至週五完整收盤）。UTC 用週日 21:00，
    # 因為 UTC+8 換算會跨過午夜：UTC 週日 21:00 = 台灣週一 05:00。
    - cron: '0 21 * * 0'   # UTC 每週日 21:00 = 台灣每週一 05:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Install CJK font for chart titles
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei

      - run: python src/fetch_data.py

      - run: python src/generate_chart.py

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - run: git add charts/

      - name: Commit chart if changed
        run: git diff --staged --quiet || git commit -m "chart $(date +%F)"

      - name: Push chart (retry on race; must land before the Flex Message references it)
        run: |
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, pulling and retrying ($i)..."
            git pull --rebase origin main
          done
          git push

      - name: Generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/generate_report.py

      - run: python src/build_flex.py

      - name: Send to LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_PUSH_TARGET_IDS: ${{ secrets.LINE_PUSH_TARGET_IDS }}
        run: python src/send_line.py

      - run: git add reports/

      - name: Commit report if changed
        run: git diff --staged --quiet || git commit -m "weekly report $(date +%F)"

      - name: Push report (retry on race with other workflows in this repo)
        run: |
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, pulling and retrying ($i)..."
            git pull --rebase origin main
          done
          git push

      - name: Notify failure
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_PUSH_TARGET_IDS: ${{ secrets.LINE_PUSH_TARGET_IDS }}
        run: python src/notify_failure.py
