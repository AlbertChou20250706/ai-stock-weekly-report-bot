name: weekly-us-report

on:
  schedule:
    - cron: '30 23 * * 0'   # UTC 週日 23:30 = 台灣週一 07:30
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python src/fetch_data_us.py

      - name: Generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/generate_report_us.py

      - name: Send to LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_PUSH_TARGET_IDS: ${{ secrets.LINE_PUSH_TARGET_IDS }}
        run: python src/send_line.py output/report_us.txt

      - name: Archive report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - run: git add reports/

      - name: Commit report if changed
        run: git diff --staged --quiet || git commit -m "weekly US report $(date +%F)"

      - run: git push

      - name: Notify failure
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_PUSH_TARGET_IDS: ${{ secrets.LINE_PUSH_TARGET_IDS }}
        run: python src/notify_failure.py
